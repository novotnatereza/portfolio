<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tereza Novotná</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #211a2e;
    --muted: #5b4f6e;
    --accent: #8c5fb0;
    --accent-dark: #6f4790;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    position: relative;
    overflow: hidden;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    background: linear-gradient(160deg, #fff3e6 0%, #fbe4ee 45%, #ecdcf6 100%);
  }
  .bloom-wrap {
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
  }
  .bloom {
    position: absolute;
    inset: 0;
  }
  .bloom--1 { background: radial-gradient(45% 50% at 18% 20%, #ffe7c7 0%, rgba(255,231,199,0) 100%); }
  .bloom--2 { background: radial-gradient(54% 58% at 82% 15%, #ffc6da 0%, rgba(255,198,218,0) 100%); }
  .bloom--3 { background: radial-gradient(62% 66% at 78% 85%, #d9c2f0 0%, rgba(217,194,240,0) 100%); }
  .bloom--4 { background: radial-gradient(58% 62% at 15% 88%, #ffd6c2 0%, rgba(255,214,194,0) 100%); }

  /* watercolor bleed: soft blurred washes trail the cursor and fade like pigment on wet paper */
  .wc-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .wc-drop {
    position: absolute;
    border-radius: 50%;
    filter: blur(22px);
    mix-blend-mode: multiply;
    opacity: 0;
    animation: wc-fade 3.2s ease-out forwards;
  }
  @keyframes wc-fade {
    0% { opacity: 0.28; }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wc-drop { display: none; }
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 32rem;
  }
  h1 {
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  p {
    margin-top: 0.9rem;
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .cta {
    position: fixed;
    left: 50%;
    bottom: 2.25rem;
    transform: translateX(-50%);
    z-index: 2;
    display: inline-block;
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    text-decoration: none;
    padding: 0.75rem 1.6rem;
    border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .cta:hover {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
    transform: translateX(-50%) translateY(-1px);
  }
  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <div class="bloom-wrap">
    <div class="bloom bloom--1"></div>
    <div class="bloom bloom--2"></div>
    <div class="bloom bloom--3"></div>
    <div class="bloom bloom--4"></div>
  </div>
  <div class="wc-layer" id="wcLayer"></div>
  <main>
    <h1>Tereza Novotná</h1>
    <p>Creative Technologist &middot; Product Designer &middot; Builder</p>
  </main>
  <a class="cta" href="portfolio/index.html">Design mentorship &rarr;</a>
  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      var wcLayer = document.getElementById('wcLayer');
      var palette = ['#ffe7c7', '#ffc6da', '#d9c2f0', '#ffd6c2'];
      var lastDrop = 0;

      document.addEventListener('mousemove', function (e) {
        var now = performance.now();
        if (now - lastDrop < 90) return;
        lastDrop = now;

        var size = 90 + Math.random() * 70;
        var drop = document.createElement('div');
        drop.className = 'wc-drop';
        drop.style.width = size + 'px';
        drop.style.height = size + 'px';
        drop.style.left = (e.clientX - size / 2) + 'px';
        drop.style.top = (e.clientY - size / 2) + 'px';
        drop.style.background = palette[Math.floor(Math.random() * palette.length)];
        wcLayer.appendChild(drop);
        drop.addEventListener('animationend', function () { drop.remove(); });
      });
    })();
  </script>
</body>
</html>
